# hibitat.visualaesthetic.com: the HIBITAT Next.js app, run by PM2 on 127.0.0.1:3002.
# Private preview: everything sits behind basic auth and is kept out of search indexes.
# Installs on the VPS as /etc/nginx/sites-available/hibitat (see deploy/README.md).
# certbot --nginx adds the 443/TLS lines and the HTTP->HTTPS redirect on first issue.
server {
    listen 80;
    listen [::]:80;
    server_name hibitat.visualaesthetic.com;

    auth_basic "hibitat";
    auth_basic_user_file /etc/nginx/.htpasswd-hibitat;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Let's Encrypt issue and renewal need no password
    location ^~ /.well-known/acme-challenge/ { auth_basic off; root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app's write budget keys on X-Real-IP; nginx overwrites it, so clients can't spoof it.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
