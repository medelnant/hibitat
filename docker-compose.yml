# Local development database. Production runs Postgres on the VPS instead.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hibitat
      POSTGRES_PASSWORD: hibitat
      POSTGRES_DB: hibitat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hibitat-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hibitat -d hibitat"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  hibitat-db:
